openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
paths:
  /api/v1/links:
    post:
      summary: Create a short link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkResponse' }
        '400': { description: Invalid request }
        '409': { description: Alias already exists }
  /{code}:
    get:
      summary: Redirect to a destination
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirect }
        '404': { description: Not found }
        '410': { description: Expired }
  /api/v1/links/{code}/analytics:
    get:
      summary: Get link analytics
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResponse' }
components:
  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        alias: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    LinkResponse:
      type: object
      required: [code, url, shortUrl]
      properties:
        code: { type: string }
        url: { type: string, format: uri }
        shortUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    AnalyticsResponse:
      type: object
      properties:
        code: { type: string }
        totalClicks: { type: integer, format: int64 }
        uniqueVisitors: { type: integer, format: int64 }
        recentEvents: { type: array, items: { type: object } }
